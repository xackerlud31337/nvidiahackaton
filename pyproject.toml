[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recontriage"
version = "0.1.0"
description = "Recon + Nemotron-powered triage for authorized security testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recontriage = "recontriage.cli:main"
recontriage-web = "recontriage.web.app:main"

[tool.setuptools.packages.find]
include = ["recontriage*"]

[tool.setuptools.package-data]
"recontriage.web" = ["static/*"]
